prometheus:
  service:
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    scrapeInterval: 5s
    serviceMonitorSelectorNilUsesHelmValues: false
    nodeSelector: { role: infra }
    tolerations: &tol
      - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
alertmanager:
  enabled: false
grafana:
  enabled: false
prometheusOperator:
  nodeSelector: { role: infra }
  tolerations: *tol
kube-state-metrics:
  nodeSelector: { role: infra }
  tolerations: *tol

