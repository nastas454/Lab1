events {
    worker_connections 1024;
}

http {
    upstream web_backend {
        server web:8000;
    }

    server {
        listen 80;
        location = /noop {
            return 204;
        }

        location / {
            proxy_pass http://web_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}